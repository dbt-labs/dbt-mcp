kind: Breaking Change
body: get_lineage (single- and multi-project) now returns a structured lineage graph (root_id/nodes/edges) instead of a list of node dicts, and links an interactive MCP-app UI that supporting MCP hosts can render; its default depth is now 1 (direct parents/children). Set DISABLE_MCP_APPS to opt out of the app resource.
