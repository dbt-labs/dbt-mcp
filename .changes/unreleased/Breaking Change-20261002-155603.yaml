kind: Breaking Change
body: Tool decorators require explicit access declarations. Context selectors are declared as function arguments with ContextInput and the model's exact types; implementations consume resolved context instead of remapped selector arguments. Named mappers reject incompatible return annotations at adaptation time. Discovery and semantic-layer tools declare a required project selector and consume bound production configuration. One registry binds schemas and arguments to current credentials, replacing separate single-project and multi-project servers and registrations. Known selectors are hidden; exposed selectors are required. list_jobs lists all environments in the selected project, or narrows to an explicitly selected environment, including staging, with no account-wide fallback. AdminApiConfig.environment_id replaces prod_environment_id to represent this filter. Optional job filters declare their account fallback explicitly. Hosts resolve environments and enforce permissions before invocation.
