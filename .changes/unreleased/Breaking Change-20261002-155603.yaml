kind: Breaking Change
body: Tool decorators require explicit access declarations. Discovery and semantic-layer tools declare a required project selector and consume bound production configuration. One registry binds schemas and arguments to current credentials, replacing separate single-project and multi-project servers and registrations. Known selectors are hidden; exposed selectors are required. list_jobs now requires a production environment and lists only that environment's jobs, removing account-wide listing and the project-wide override. Optional job filters declare their account fallback explicitly. Hosts resolve environments and enforce permissions before invocation.
