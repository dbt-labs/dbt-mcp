kind: Breaking Change
body: Tool decorators require explicit access declarations on target arguments or in top-level requirements. Discovery tools declare a project selector and consume bound configuration; semantic-layer tools declare project and environment inputs. Context adapters can declare an environment requirement for host resolution without exposing an environment-ID argument. Context binding hides known inputs from caller schemas and injects their values at invocation; single-project and multi-project registration share canonical tool implementations.
