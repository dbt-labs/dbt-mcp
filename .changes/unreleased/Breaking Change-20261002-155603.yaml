kind: Breaking Change
body: Tool decorators require explicit access declarations. Context selectors are declared as function arguments with the model's exact types and explicitly removed from body invocation with remove_body_parameters; implementations consume resolved context instead of remapped selector arguments. Injection uses named mappers only and rejects incompatible return annotations at adaptation time; type-based and positional mapper APIs have been removed. Discovery fetchers are constructed with resolved configuration. Discovery and semantic-layer tools declare a required project selector and consume bound production configuration. One registry binds schemas and arguments to current credentials, replacing separate single-project and multi-project servers and registrations. Known selectors are hidden; exposed selectors are required. list_jobs lists all environments in the selected project, or narrows to an explicitly selected environment, including staging, with no account-wide fallback. AdminApiConfig.environment_id replaces prod_environment_id to represent this filter. Optional job filters declare a top-level account requirement and check the job's owner only when supplied. Hosts resolve environments and enforce permissions before invocation.
