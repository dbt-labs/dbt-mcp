kind: Enhancement or New Feature
body: Tools declare their inputs and access requirements. Named context mappers replace positional and type-based injection; implementations read resolved targets from context. HIDE omits unused selectors, and value mappers inject known selections. FastMCP generates the schema and validator and rejects extra inputs before mapping. Hosts resolve and authorize targets while building context; ordinary mapper inputs also reach the implementation unchanged. One registry replaces separate single-project and multi-project tools. Discovery fetchers hold resolved configuration. list_jobs requires a project or selected environment and includes staging; account-wide listing is removed. AdminApiConfig.environment_id replaces prod_environment_id. Hosts enforce ownership checks for supplied job/run IDs.
