name: PR pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  # checks the code for styling and type errors
  check:
    name: Check styling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: setup python
        uses: ./.github/actions/setup-python
        id: setup-python
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10
        with:
          version: 10
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install dependencies
        run: task install
      - name: Run check
        run: task check

  # runs the unit tests
  unit-test:
    name: Unit test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs:
      - check
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: setup python
        uses: ./.github/actions/setup-python
        id: setup-python
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10
        with:
          version: 10
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Run tests
        run: task test:unit

  # validates documentation is up to date
  validate-docs:
    name: Validate tool docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs:
      - check
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: setup python
        uses: ./.github/actions/setup-python
        id: setup-python
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --
      - name: Validate documentation is up to date
        run: task docs:generate CHECK_FLAG=1

  # validates the published-app contract snapshot is up to date
  validate-contract:
    name: Validate app contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - check
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: setup python
        uses: ./.github/actions/setup-python
        id: setup-python
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Validate contract snapshot is up to date
        # setup-python already runs `uv sync`; the check only needs `uv run`,
        # so no pnpm / UI build / `task install` is required here.
        run: task contract:check

  # validates mcpb manifest
  validate-mcpb:
    name: Validate mcpb manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs:
      - check
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: setup mcpb
        uses: ./.github/actions/setup-mcpb
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Validate manifest
        run: task mcpb:validate
