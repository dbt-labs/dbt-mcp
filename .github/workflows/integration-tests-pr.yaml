name: Integration tests

# SECURITY: Each PR is tested by the trigger that fits where it comes from (the job is skipped
# for the other trigger):
# 1. Internal PRs (same repo): pull_request. Uses the workflow file from the PR.
# 2. Fork PRs: pull_request_target. Uses the workflow file from the base branch and checks out
#    the PR head commit (untrusted code).
#
# The `integration` environment holds the credentials and requires reviewer approval, so every
# run (i.e. every pushed commit) waits for a maintainer before any secret is exposed. Review the
# whole diff before approving, including test files, Taskfile and local actions: they run with
# the environment's secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: &ignore-paths
      - "*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".cursor/**"
      - ".changes/**"
      - "LICENSE"
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore: *ignore-paths

permissions:
  contents: read
  pull-requests: read

jobs:
  integration:
    # Run pull_request for same-repo PRs and pull_request_target for fork PRs, so that
    # each PR is only tested once. The job is skipped for the other trigger.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    environment: integration
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          # For pull_request_target, check out the exact commit the run was created for (untrusted
          # code, approved through the environment). For pull_request, use the default behavior.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup Python
        uses: ./.github/actions/setup-python
        id: setup-python

      - name: Install go-task
        uses: ./.github/actions/setup-task

      - name: Run integration tests
        env:
          DBT_HOST: ${{ vars.DBT_HOST }}
          MULTICELL_ACCOUNT_PREFIX: ${{ vars.MULTICELL_ACCOUNT_PREFIX }}
          DBT_TOKEN: ${{ secrets.DBT_TOKEN }}
          DBT_ACCOUNT_ID: ${{ vars.DBT_ACCOUNT_ID }}
          DBT_PROD_ENV_ID: ${{ vars.DBT_PROD_ENV_ID }}
          DBT_DEV_ENV_ID: ${{ vars.DBT_DEV_ENV_ID }}
          DBT_USER_ID: ${{ vars.DBT_USER_ID }}
        run: task test:integration
