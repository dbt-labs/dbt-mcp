name: Release dbt-mcp

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    outputs:
      changie-latest: ${{ steps.changie-latest.outputs.output }}
    if: "startsWith(github.event.head_commit.message, 'version:')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-python
      - name: Get the latest version
        id: changie-latest
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # miniscruff/changie-action@v3.0.1
        with:
          version: latest
          args: latest
      - name: Create tag
        env:
          TAG: ${{ steps.changie-latest.outputs.output }}
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: create-release-tag
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ needs.create-release-tag.outputs.changie-latest }}
          fetch-tags: true

      - name: setup python
        uses: ./.github/actions/setup-python
        id: setup-python

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Run tests
        run: task test:unit

      - name: Build
        run: task build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./dist

  create-github-release:
    runs-on: ubuntu-latest
    needs: create-release-tag
    permissions:
      contents: write # required to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Fetches all history for changie to work correctly

      - name: Get the latest version
        id: changie-latest
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # miniscruff/changie-action@v3.0.1
        with:
          version: latest
          args: latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changie-latest.outputs.output }}
        run: |
          echo "Creating release for version: $VERSION"
          gh release create "$VERSION" \
            --notes-file ".changes/$VERSION.md" \
            --title "$VERSION"

  mcpb-pack:
    runs-on: ubuntu-latest
    needs: [create-release-tag, create-github-release]
    permissions:
      contents: write # required to upload release assets
    env:
      MCPB_PACKAGE_NAME: dbt-mcp.mcpb
      # MCPB_CERT: ${{ secrets.MCPB_CERT }}
      # MCPB_KEY: ${{ secrets.MCPB_KEY }}     

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ needs.create-release-tag.outputs.changie-latest }}
          fetch-tags: true

      - name: Setup mcpb
        uses: ./.github/actions/setup-mcpb          

      - name: Setup python
        uses: ./.github/actions/setup-python

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Pack mcpb package
        run: task mcpb:pack

      # Tested locally, 01/07/26 with valid MCPB_CERT and MCPB_KEY pair
      # but `mcpb verify` failed due to known mcpb bug:
      # https://github.com/modelcontextprotocol/mcpb/issues/21
      # - name: Sign and verify bundle
      #   run: task mcpb:sign-and-verify

      - name: Upload mcpb package to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.create-release-tag.outputs.changie-latest }}
          files: ${{ env.MCPB_PACKAGE_NAME }}
