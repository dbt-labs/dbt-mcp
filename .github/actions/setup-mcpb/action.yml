name: Setup mcpb
description: Setup Node.js and install mcpb CLI

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
      with:
        node-version: '24'

    - name: Install mcpb
      shell: bash
      run: npm install -g @anthropic-ai/mcpb@2.1.2
