query PublicMeshModels(
  $environmentId: BigInt!
  $modelsFilter: ModelAppliedFilter
  $after: String
  $first: Int
  $sort: AppliedModelSort
) {
  environment(id: $environmentId) {
    applied {
      models(filter: $modelsFilter, after: $after, first: $first, sort: $sort) {
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            name
            uniqueId
            description
            access
            # group
            # contractEnforced
            database
            schema
            alias
            relationName
            # filePath
            # fqn
            version
            latestVersion
            # executionInfo {
            #   lastRunStatus
            #   lastRunGeneratedAt
            # }
          }
        }
      }
    }
  }
}
